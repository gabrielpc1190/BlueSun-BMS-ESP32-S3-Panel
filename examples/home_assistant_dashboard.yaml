# Home Assistant Battery dashboard view — example for the BlueSun BMS panel.
#
# This is a single VIEW (not a full dashboard). Drop it into the views: list of
# any storage-mode dashboard, or use it as the body of a yaml-mode dashboard.
#
# Entity prefix used here: sensor.panel_cuartoelectrico_bluesun_*
# After importing, find-and-replace with YOUR panel's actual prefix
# (e.g. sensor.bluesun_bms_panel_bluesun_*) — depends on the name: substitution
# you set in firmware/bluesun-bms-panel.yaml.
#
# Optional dependencies:
#   - mini-graph-card (HACS) — for the per-cell voltage chart
# If not installed, drop those entries; the rest of the view works on stock HA.

title: Battery
path: battery
icon: mdi:battery
subview: true
badges:
- type: entity
  show_name: true
  show_state: true
  show_icon: true
  entity: sensor.panel_cuartoelectrico_bluesun_bank_soc_avg
  name: SoC banco
- type: entity
  show_name: true
  show_state: true
  show_icon: true
  entity: sensor.panel_cuartoelectrico_bluesun_bank_power
  name: Potencia
- type: entity
  show_name: true
  show_state: true
  show_icon: true
  entity: sensor.panel_cuartoelectrico_bluesun_bank_current_total
  name: Corriente banco
- type: entity
  show_name: true
  show_state: true
  show_icon: true
  entity: sensor.panel_cuartoelectrico_bluesun_bank_voltage_avg
  name: V promedio
- type: entity
  show_name: true
  show_state: true
  show_icon: true
  entity: sensor.panel_cuartoelectrico_bluesun_bank_soc_spread
  name: Spread SoC
- type: entity
  show_name: true
  show_state: true
  show_icon: true
  entity: sensor.panel_cuartoelectrico_bluesun_bank_max_cell_temp
  name: T° máx
- type: entity
  show_name: true
  show_state: true
  show_icon: true
  entity: sensor.panel_cuartoelectrico_bluesun_bank_min_soh
  name: SoH mín
cards:
- type: entities
  title: Banco BlueSun
  show_header_toggle: false
  entities:
  - entity: sensor.panel_cuartoelectrico_bluesun_bank_soc_avg
    name: SoC promedio
    icon: mdi:battery-70
    secondary_info: last-changed
  - entity: sensor.panel_cuartoelectrico_bluesun_bank_remaining_ah
    name: Capacidad remanente (total)
  - entity: sensor.panel_cuartoelectrico_bluesun_bank_nominal_ah
    name: Capacidad nominal (total)
  - entity: sensor.panel_cuartoelectrico_bluesun_bank_voltage_avg
    name: Voltaje promedio packs
    secondary_info: last-changed
  - entity: sensor.panel_cuartoelectrico_bluesun_bank_current_total
    name: Corriente total (+ carga, − descarga)
    secondary_info: last-changed
  - entity: sensor.panel_cuartoelectrico_bluesun_bank_power
    name: Potencia instantánea
    secondary_info: last-changed
  - type: section
    label: Energía acumulada (lifetime, para Energy Dashboard)
  - entity: sensor.panel_cuartoelectrico_bluesun_battery_energy_in
    name: Energía entrada (charging)
  - entity: sensor.panel_cuartoelectrico_bluesun_battery_energy_out
    name: Energía salida (discharging)
  - type: section
    label: Salud del banco
  - entity: sensor.panel_cuartoelectrico_bluesun_bank_soc_spread
    name: Spread SoC entre packs
  - entity: sensor.panel_cuartoelectrico_bluesun_bank_min_soh
    name: SoH mínimo
  - entity: sensor.panel_cuartoelectrico_bluesun_bank_max_cycles
    name: Ciclos máximos
  - entity: sensor.panel_cuartoelectrico_bluesun_bank_max_cell_temp
    name: Temp máx celda
