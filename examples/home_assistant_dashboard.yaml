- type: vertical-stack
  cards:
  - type: custom:mini-graph-card
    name: Potencia del banco (últimas 6 h)
    icon: mdi:home-battery
    hours_to_show: 6
    points_per_hour: 60
    entities:
    - sensor.panel_cuartoelectrico_bluesun_bank_power
    show:
      labels: true
      name: true
      icon: true
  - type: history-graph
    title: SoC por pack (últimas 24 h)
    hours_to_show: 24
    entities:
    - sensor.panel_cuartoelectrico_bluesun_pack01_soc
    - sensor.panel_cuartoelectrico_bluesun_pack02_soc
    - sensor.panel_cuartoelectrico_bluesun_pack03_soc
    - sensor.panel_cuartoelectrico_bluesun_pack04_soc
  - type: history-graph
    title: Voltaje por pack (últimas 2 h)
    hours_to_show: 2
    entities:
    - sensor.panel_cuartoelectrico_bluesun_pack01_voltage
    - sensor.panel_cuartoelectrico_bluesun_pack02_voltage
    - sensor.panel_cuartoelectrico_bluesun_pack03_voltage
    - sensor.panel_cuartoelectrico_bluesun_pack04_voltage
  - type: history-graph
    title: Corriente por pack (últimas 2 h)
    hours_to_show: 2
    entities:
    - sensor.panel_cuartoelectrico_bluesun_pack01_current
    - sensor.panel_cuartoelectrico_bluesun_pack02_current
    - sensor.panel_cuartoelectrico_bluesun_pack03_current
    - sensor.panel_cuartoelectrico_bluesun_pack04_current
