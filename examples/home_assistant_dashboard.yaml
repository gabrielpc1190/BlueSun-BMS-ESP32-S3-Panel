    - sensor.panel_cuartoelectrico_bluesun_pack02_cell_v_min
    - sensor.panel_cuartoelectrico_bluesun_pack03_cell_v_min
    - sensor.panel_cuartoelectrico_bluesun_pack04_cell_v_min
  - type: horizontal-stack
    cards:
    - type: statistic
      entity: sensor.panel_cuartoelectrico_bluesun_bank_power
      period:
        calendar:
          period: day
      stat_type: mean
      name: Hoy potencia promedio
    - type: statistic
      entity: sensor.panel_cuartoelectrico_bluesun_bank_current_total
      period:
        calendar:
          period: day
      stat_type: mean
      name: Hoy corriente promedio
- type: entities
  title: Controles
  entities:
  - type: section
    label: Polling runtime (datos críticos — cmd 0x10)
  - entity: number.panel_cuartoelectrico_bluesun_poll_fast_cmd_0x10
    name: Ciclo fast (s) — current/voltage/SoC
    secondary_info: last-changed
  - type: section
    label: Polling diagnóstico (cells + temps — cmd 0x11)
  - entity: number.panel_cuartoelectrico_bluesun_poll_slow_cmd_0x11
    name: Ciclo slow (s) — cells + temps
    secondary_info: last-changed
  - type: section
    label: Diagnóstico y recovery
  - entity: sensor.panel_cuartoelectrico_bluesun_octopus_parses_ok
    name: Parses OK
    secondary_info: last-changed
