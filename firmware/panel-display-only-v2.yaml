# === Text sensors: serials per-pack ===
# Hardcoded en globals (ver §Globals). Publicados a HA via on_boot lambda
# en la sección esphome:. La app Octopus no consulta serial per-pack via
# BLE (validado HCI); leemos del label físico al instalar.
text_sensor:
  - { platform: template, id: pack01_serial_ts, name: "BlueSun Pack01 Serial", icon: "mdi:identifier" }
  - { platform: template, id: pack02_serial_ts, name: "BlueSun Pack02 Serial", icon: "mdi:identifier" }
  - { platform: template, id: pack03_serial_ts, name: "BlueSun Pack03 Serial", icon: "mdi:identifier" }
  - { platform: template, id: pack04_serial_ts, name: "BlueSun Pack04 Serial", icon: "mdi:identifier" }

# === Update labels Packs cards + Cells page cada 5s ===
interval:
  - interval: 5s
    then:
      - lvgl.label.update: { id: lbl_p1_v, text: !lambda 'return id(pack01_voltage).has_state() ? str_sprintf("%.1f V", id(pack01_voltage).state) : std::string("-- V");' }
      - lvgl.label.update:
          id: lbl_p1_i
          text: !lambda |-
            if (!id(pack01_current).has_state()) return std::string("-- A");
            return str_sprintf("%.1f A", id(pack01_current).state);
          text_color: !lambda |-
            float i = id(pack01_current).has_state() ? id(pack01_current).state : 0.0f;  // signo: + = carga
            if (i >= 0.5f)       return lv_color_hex(0x43A047);
            else if (i <= -0.5f) return lv_color_hex(0xFF7043);
            else                 return lv_color_hex(0xFFFFFF);
      - lvgl.label.update:
          id: lbl_p1_w
          text: !lambda |-
            if (!id(pack01_current).has_state() || !id(pack01_voltage).has_state()) return std::string("-- W");
            return str_sprintf("%.0f W", id(pack01_voltage).state * id(pack01_current).state);
          text_color: !lambda |-
            float i = id(pack01_current).has_state() ? id(pack01_current).state : 0.0f;  // signo: + = carga
