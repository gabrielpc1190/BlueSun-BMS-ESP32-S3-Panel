      - lvgl.label.update: { id: lbl_p3_t, text: !lambda 'return id(pack03_cell_temp_1).has_state() ? str_sprintf("T %.0f C", id(pack03_cell_temp_1).state) : std::string("T -- C");' }
      - lvgl.label.update: { id: lbl_p3_d, text: !lambda 'return id(pack03_cell_v_delta).has_state() ? str_sprintf("d %.0f mV", id(pack03_cell_v_delta).state) : std::string("d -- mV");' }
      - lvgl.label.update: { id: lbl_p3_soh, text: !lambda 'return id(pack03_soh).has_state() ? str_sprintf("SoH %.0f%%", id(pack03_soh).state) : std::string("SoH --%");' }
      - lvgl.label.update: { id: lbl_p3_cycles, text: !lambda 'return id(pack03_cycles).has_state() ? str_sprintf("C %.0f", id(pack03_cycles).state) : std::string("C --");' }
      - lvgl.label.update: { id: lbl_p4_v, text: !lambda 'return id(pack04_voltage).has_state() ? str_sprintf("%.1f V", id(pack04_voltage).state) : std::string("-- V");' }
      - lvgl.label.update:
          id: lbl_p4_i
          text: !lambda |-
            if (!id(pack04_current).has_state()) return std::string("-- A");
            return str_sprintf("%.1f A", id(pack04_current).state);
          text_color: !lambda |-
            float i = id(pack04_current).has_state() ? id(pack04_current).state : 0.0f;  // signo: + = carga
            if (i >= 0.5f)       return lv_color_hex(0x43A047);
            else if (i <= -0.5f) return lv_color_hex(0xFF7043);
            else                 return lv_color_hex(0xFFFFFF);
      - lvgl.label.update:
          id: lbl_p4_w
          text: !lambda |-
            if (!id(pack04_current).has_state() || !id(pack04_voltage).has_state()) return std::string("-- W");
            return str_sprintf("%.0f W", id(pack04_voltage).state * id(pack04_current).state);
          text_color: !lambda |-
            float i = id(pack04_current).has_state() ? id(pack04_current).state : 0.0f;  // signo: + = carga
            if (i >= 0.5f)       return lv_color_hex(0x43A047);
            else if (i <= -0.5f) return lv_color_hex(0xFF7043);
            else                 return lv_color_hex(0xFFFFFF);
      - lvgl.label.update: { id: lbl_p4_t, text: !lambda 'return id(pack04_cell_temp_1).has_state() ? str_sprintf("T %.0f C", id(pack04_cell_temp_1).state) : std::string("T -- C");' }
      - lvgl.label.update: { id: lbl_p4_d, text: !lambda 'return id(pack04_cell_v_delta).has_state() ? str_sprintf("d %.0f mV", id(pack04_cell_v_delta).state) : std::string("d -- mV");' }
      - lvgl.label.update: { id: lbl_p4_soh, text: !lambda 'return id(pack04_soh).has_state() ? str_sprintf("SoH %.0f%%", id(pack04_soh).state) : std::string("SoH --%");' }
      - lvgl.label.update: { id: lbl_p4_cycles, text: !lambda 'return id(pack04_cycles).has_state() ? str_sprintf("C %.0f", id(pack04_cycles).state) : std::string("C --");' }
      # === Evaluar warning flags por pack (SoH<95 OR cycles_delta>50 OR Ah_rem/nom<90%) ===
      - lambda: |-
          float c_min = 1e9f;
          for (auto *s : {id(pack01_cycles),id(pack02_cycles),id(pack03_cycles),id(pack04_cycles)}) {
            if (s->has_state() && s->state < c_min) c_min = s->state;
          }
          auto eval = [c_min](esphome::sensor::Sensor *soh, esphome::sensor::Sensor *cyc,
                              esphome::sensor::Sensor *rem, esphome::sensor::Sensor *nom) -> bool {
            if (soh->has_state() && soh->state < 95.0f) return true;
            if (cyc->has_state() && c_min < 1e8f && (cyc->state - c_min) > 50.0f) return true;
            if (rem->has_state() && nom->has_state() && nom->state > 0.1f
                && (1.0f - rem->state/nom->state) > 0.10f) return true;
            return false;
          };
          id(p1_warning) = eval(id(pack01_soh), id(pack01_cycles), id(pack01_remaining_ah), id(pack01_nominal_ah));
          id(p2_warning) = eval(id(pack02_soh), id(pack02_cycles), id(pack02_remaining_ah), id(pack02_nominal_ah));
          id(p3_warning) = eval(id(pack03_soh), id(pack03_cycles), id(pack03_remaining_ah), id(pack03_nominal_ah));
          id(p4_warning) = eval(id(pack04_soh), id(pack04_cycles), id(pack04_remaining_ah), id(pack04_nominal_ah));
      # === Aplicar color condicional: ámbar si warning, gris/blanco default ===
      - if:
          condition: { lambda: 'return id(p1_warning);' }
          then:
            - lvgl.widget.update: { id: lbl_p1_title,  text_color: 0xFFA726 }
            - lvgl.widget.update: { id: lbl_p1_cycles, text_color: 0xFFA726 }
            - lvgl.widget.update: { id: lbl_p1_soh,    text_color: 0xFFA726 }
            - lvgl.widget.update: { id: lbl_p1_d,      text_color: 0xFFA726 }
            - lvgl.widget.update: { id: lbl_pack1,     text_color: 0xFFA726 }
          else:
            - lvgl.widget.update: { id: lbl_p1_title,  text_color: 0xB0BEC5 }
            - lvgl.widget.update: { id: lbl_p1_cycles, text_color: 0xFFFFFF }
            - lvgl.widget.update: { id: lbl_p1_soh,    text_color: 0xFFFFFF }
            - lvgl.widget.update: { id: lbl_p1_d,      text_color: 0xFFFFFF }
            - lvgl.widget.update: { id: lbl_pack1,     text_color: 0xFFFFFF }
      - if:
          condition: { lambda: 'return id(p2_warning);' }
          then:
            - lvgl.widget.update: { id: lbl_p2_title,  text_color: 0xFFA726 }
            - lvgl.widget.update: { id: lbl_p2_cycles, text_color: 0xFFA726 }
            - lvgl.widget.update: { id: lbl_p2_soh,    text_color: 0xFFA726 }
            - lvgl.widget.update: { id: lbl_p2_d,      text_color: 0xFFA726 }
            - lvgl.widget.update: { id: lbl_pack2,     text_color: 0xFFA726 }
          else:
            - lvgl.widget.update: { id: lbl_p2_title,  text_color: 0xB0BEC5 }
            - lvgl.widget.update: { id: lbl_p2_cycles, text_color: 0xFFFFFF }
            - lvgl.widget.update: { id: lbl_p2_soh,    text_color: 0xFFFFFF }
            - lvgl.widget.update: { id: lbl_p2_d,      text_color: 0xFFFFFF }
            - lvgl.widget.update: { id: lbl_pack2,     text_color: 0xFFFFFF }
      - if:
          condition: { lambda: 'return id(p3_warning);' }
          then:
            - lvgl.widget.update: { id: lbl_p3_title,  text_color: 0xFFA726 }
            - lvgl.widget.update: { id: lbl_p3_cycles, text_color: 0xFFA726 }
            - lvgl.widget.update: { id: lbl_p3_soh,    text_color: 0xFFA726 }
            - lvgl.widget.update: { id: lbl_p3_d,      text_color: 0xFFA726 }
            - lvgl.widget.update: { id: lbl_pack3,     text_color: 0xFFA726 }
          else:
            - lvgl.widget.update: { id: lbl_p3_title,  text_color: 0xB0BEC5 }
            - lvgl.widget.update: { id: lbl_p3_cycles, text_color: 0xFFFFFF }
            - lvgl.widget.update: { id: lbl_p3_soh,    text_color: 0xFFFFFF }
            - lvgl.widget.update: { id: lbl_p3_d,      text_color: 0xFFFFFF }
            - lvgl.widget.update: { id: lbl_pack3,     text_color: 0xFFFFFF }
      - if:
          condition: { lambda: 'return id(p4_warning);' }
          then:
            - lvgl.widget.update: { id: lbl_p4_title,  text_color: 0xFFA726 }
            - lvgl.widget.update: { id: lbl_p4_cycles, text_color: 0xFFA726 }
            - lvgl.widget.update: { id: lbl_p4_soh,    text_color: 0xFFA726 }
            - lvgl.widget.update: { id: lbl_p4_d,      text_color: 0xFFA726 }
            - lvgl.widget.update: { id: lbl_pack4,     text_color: 0xFFA726 }
          else:
            - lvgl.widget.update: { id: lbl_p4_title,  text_color: 0xB0BEC5 }
            - lvgl.widget.update: { id: lbl_p4_cycles, text_color: 0xFFFFFF }
            - lvgl.widget.update: { id: lbl_p4_soh,    text_color: 0xFFFFFF }
            - lvgl.widget.update: { id: lbl_p4_d,      text_color: 0xFFFFFF }
            - lvgl.widget.update: { id: lbl_pack4,     text_color: 0xFFFFFF }
      # Cells page (segun selected_pack)
      - lvgl.label.update:
          id: lbl_cells_v
          text: !lambda |-
            int p = id(selected_pack);
            esphome::sensor::Sensor *vmin=nullptr, *vmax=nullptr, *vavg=nullptr, *vdelta=nullptr;
            switch (p) {
              case 1: vmin=id(pack01_cell_v_min); vmax=id(pack01_cell_v_max); vavg=id(pack01_cell_v_avg); vdelta=id(pack01_cell_v_delta); break;
              case 2: vmin=id(pack02_cell_v_min); vmax=id(pack02_cell_v_max); vavg=id(pack02_cell_v_avg); vdelta=id(pack02_cell_v_delta); break;
              case 3: vmin=id(pack03_cell_v_min); vmax=id(pack03_cell_v_max); vavg=id(pack03_cell_v_avg); vdelta=id(pack03_cell_v_delta); break;
              case 4: vmin=id(pack04_cell_v_min); vmax=id(pack04_cell_v_max); vavg=id(pack04_cell_v_avg); vdelta=id(pack04_cell_v_delta); break;
              default: return std::string("Vmin --");
            }
            if (!vmin->has_state()) return std::string("Vmin --");
            return str_sprintf("Vmin %.3f  Vmax %.3f  Vavg %.3f  d %.0f mV",
              vmin->state/1000.0f, vmax->state/1000.0f, vavg->state/1000.0f, vdelta->state);
      - lvgl.label.update:
          id: lbl_cells_t
          text: !lambda |-
            int p = id(selected_pack);
            esphome::sensor::Sensor *t1=nullptr,*t2=nullptr,*t3=nullptr,*t4=nullptr;
            switch (p) {
              case 1: t1=id(pack01_cell_temp_1); t2=id(pack01_cell_temp_2); t3=id(pack01_cell_temp_3); t4=id(pack01_cell_temp_4); break;
              case 2: t1=id(pack02_cell_temp_1); t2=id(pack02_cell_temp_2); t3=id(pack02_cell_temp_3); t4=id(pack02_cell_temp_4); break;
              case 3: t1=id(pack03_cell_temp_1); t2=id(pack03_cell_temp_2); t3=id(pack03_cell_temp_3); t4=id(pack03_cell_temp_4); break;
              case 4: t1=id(pack04_cell_temp_1); t2=id(pack04_cell_temp_2); t3=id(pack04_cell_temp_3); t4=id(pack04_cell_temp_4); break;
              default: return std::string("T1 --");
            }
            if (!t1->has_state()) return std::string("T1 --");
            return str_sprintf("T1 %.0f  T2 %.0f  T3 %.0f  T4 %.0f", t1->state, t2->state, t3->state, t4->state);
      - lvgl.label.update:
          id: lbl_cells_env
          text: !lambda |-
            int p = id(selected_pack);
            esphome::sensor::Sensor *env=nullptr,*pcb=nullptr;
            switch (p) {
              case 1: env=id(pack01_env_temp); pcb=id(pack01_pcb_temp); break;
              case 2: env=id(pack02_env_temp); pcb=id(pack02_pcb_temp); break;
              case 3: env=id(pack03_env_temp); pcb=id(pack03_pcb_temp); break;
              case 4: env=id(pack04_env_temp); pcb=id(pack04_pcb_temp); break;
              default: return std::string("PCB --   ENV --");
            }
            if (!env->has_state()) return std::string("PCB --   ENV --");
            return str_sprintf("PCB %.0f C   ENV %.0f C", pcb->state, env->state);
      - lvgl.label.update:
          id: lbl_cells_serial
          text: !lambda |-
            int p = id(selected_pack);
            std::string *sn = nullptr;
            switch (p) {
              case 1: sn = &id(pack01_serial_str); break;
              case 2: sn = &id(pack02_serial_str); break;
              case 3: sn = &id(pack03_serial_str); break;
              case 4: sn = &id(pack04_serial_str); break;
              default: return std::string("SN: --");
            }
            return (sn && !sn->empty()) ? std::string("SN: ") + *sn : std::string("SN: --");
