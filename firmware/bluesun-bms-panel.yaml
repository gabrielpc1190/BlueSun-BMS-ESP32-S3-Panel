# bluesun-bms-panel.yaml
# Step 5: step4 + 3 vistas LVGL completas (Banco / Packs / Celdas) con mocks que
# leen los sensores BMS reales y actualizan labels/bars via on_value.
# Si BLE sigue conectando aqui, el firmware esta funcionalmente completo.

substitutions:
  name: "bluesun-bms-panel"
  friendly_name: "BlueSun BMS Panel"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.4.0

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      # Imprescindible cuando el touch I2C usa GPIO19 (default ESP-IDF lo agarra para
      # USB-Serial-JTAG silenciosamente y rompe el touch).
      CONFIG_ESP_CONSOLE_USB_SERIAL_JTAG: n

psram:
  mode: octal
  speed: 80MHz

logger:
  baud_rate: 115200
  level: INFO
  hardware_uart: UART0
  logs:
    component: ERROR

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  use_address: !secret panel_static_ip   # change to your reserved IP for OTA
  fast_connect: true
  ap:
    ssid: "BlueSun-BMS-Panel Hotspot"
    password: !secret fallback_ap_password

# === BLE: TODO defaults ===
esp32_ble:
esp32_ble_tracker:
  on_ble_advertise:
    - mac_address: !secret bms_master_mac
      then:
        - lambda: |-
            ESP_LOGI("ble_scan", "*** BMS visto: rssi=%d ***", x.get_rssi());

ble_client:
  - id: master
    mac_address: !secret bms_master_mac
    on_connect:
      then:
        - logger.log: { format: "*** BMS CONECTADO ***", level: INFO }
        - delay: 1500ms       # da tiempo a service discovery antes que scheduler escriba
    on_disconnect:
      then:
        - logger.log: { format: "*** BMS DESCONECTADO ***", level: WARN }

# === Backlight PWM (GPIO38) ===
output:
  - platform: ledc
    pin: GPIO38
    id: backlight_pwm
    frequency: 5000Hz

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Panel Backlight"
    id: panel_backlight
    restore_mode: ALWAYS_ON
    default_transition_length: 200ms

# === Display ST7701S init via SPI sideband + RGB-565 16-bit @ 12 MHz ===
spi:
  - id: lcd_init_spi
    clk_pin: GPIO48
    mosi_pin: GPIO47
    interface: software

display:
  - platform: st7701s
    id: panel_display
    spi_id: lcd_init_spi
    cs_pin: GPIO39
    de_pin: GPIO18
    hsync_pin: GPIO16
    vsync_pin: GPIO17
    pclk_pin: GPIO21
    pclk_frequency: 12MHz
    data_pins:
      red:    [GPIO11, GPIO12, GPIO13, GPIO14, GPIO0]
      green:  [GPIO8, GPIO20, GPIO3, GPIO46, GPIO9, GPIO10]
      blue:   [GPIO4, GPIO5, GPIO6, GPIO7, GPIO15]
    dimensions:
      width: 480
      height: 480
    hsync_back_porch: 10
    hsync_front_porch: 50
    hsync_pulse_width: 8
    vsync_back_porch: 10
    vsync_front_porch: 20
    vsync_pulse_width: 8
    update_interval: never       # sin LVGL todavia
    auto_clear_enabled: false

# === Touch GT911 (I2C @ 0x5D) ===
i2c:
  - id: bus_touch
    sda: GPIO19
    scl:
      number: GPIO45
      ignore_strapping_warning: true
    scan: true
    frequency: 100kHz

touchscreen:
  - platform: gt911
    id: panel_touch
    i2c_id: bus_touch
    display: panel_display
    transform:
      mirror_x: false
      mirror_y: false
      swap_xy: false

# === Fonts (Montserrat) — bpp:1 pixel-perfect, sin halo ===
font:
  - file: "gfonts://Montserrat@700"
    id: font_xl
    size: 96
    bpp: 1
    glyphs: "0123456789%-."
  - file: "gfonts://Montserrat@700"
    id: font_lg
    size: 48
    bpp: 1
  - file: "gfonts://Montserrat@700"
    id: font_md
    size: 28
    bpp: 1
  - file: "gfonts://Montserrat@700"
    id: font_sm
    size: 20
    bpp: 1
  - file: "gfonts://Montserrat@700"
    id: font_xs
    size: 14
    bpp: 1
    glyphs: "0123456789+-. AW%"

# === Reloj HA ===
time:
  - platform: homeassistant
    id: ha_time
    timezone: "America/El_Salvador"   # change to your local IANA timezone
    on_time:
      - seconds: 0
        then:
          - lvgl.label.update:
              id: lbl_clock
              text: !lambda |-
                auto t = id(ha_time).now();
                return str_sprintf("%02d:%02d", t.hour, t.minute);

# === LVGL — 3 vistas: Banco / Packs / Celdas ===
lvgl:
  displays:
    - panel_display
  touchscreens:
    - panel_touch
  buffer_size: 12%
  rotation: 270
  log_level: WARN
  theme:
    obj:
      bg_color: 0x000000
      text_color: 0xFFFFFF
      border_width: 0
  pages:
    - id: home_page
      bg_color: 0x000000
      on_swipe_left:
        - lvgl.page.show: packs_page
      widgets:
        - label:
            id: lbl_clock
            text: "00:00"
            text_font: font_md
            text_color: 0xFFFFFF
            align: TOP_RIGHT
            x: -15
            y: 10
        - label:
            id: lbl_mode_badge
            text: ""
            text_font: font_sm
            text_color: 0xFFD700
            align: TOP_LEFT
            x: 10
            y: 10
        - label:
            id: lbl_soc_big
            text: "--%"
            text_font: font_xl
            text_color: 0x43A047
            align: TOP_MID
            y: 60
        - label:
            # Linea derivada del banco: potencia + autonomia + energia disponible.
            # Se actualiza desde el on_value de mock_bank_p (cada 5s).
            id: lbl_bank_info
            text: ""
            text_font: font_sm
            text_color: 0xB0BEC5
            align: TOP_MID
            y: 165
        - bar:
            id: bar_soc
            min_value: 0
            max_value: 100
            value: 0
            x: 40
            y: 200
            width: 400
            height: 20
            indicator:
              bg_color: 0x43A047
        - label:
            id: lbl_vip
            text: "-- V    -- A    -- W"
            text_font: font_md
            text_color: 0xFFFFFF
            align: TOP_MID
            y: 240
        - label: { id: lbl_pack1, text: "P1 --%", text_font: font_sm, x: 30,  y: 320 }
        - bar:
            id: bar_pack1
            x: 30
            y: 350
            width: 90
            height: 16
            min_value: 0
            max_value: 100
            value: 0
            indicator: { bg_color: 0x43A047 }
        - label: { id: lbl_pwr1, text: "", text_font: font_xs, text_color: 0x6E7B82, x: 30,  y: 370 }
        - label: { id: lbl_pack2, text: "P2 --%", text_font: font_sm, x: 140, y: 320 }
        - bar:
            id: bar_pack2
            x: 140
            y: 350
            width: 90
            height: 16
            min_value: 0
            max_value: 100
            value: 0
            indicator: { bg_color: 0x43A047 }
        - label: { id: lbl_pwr2, text: "", text_font: font_xs, text_color: 0x6E7B82, x: 140, y: 370 }
        - label: { id: lbl_pack3, text: "P3 --%", text_font: font_sm, text_color: 0xFFA726, x: 250, y: 320 }
        - bar:
            id: bar_pack3
            x: 250
            y: 350
            width: 90
            height: 16
            min_value: 0
            max_value: 100
            value: 0
            border_color: 0xFFA726
            border_width: 2
            indicator: { bg_color: 0xFFA726 }
        - label: { id: lbl_pwr3, text: "", text_font: font_xs, text_color: 0x6E7B82, x: 250, y: 370 }
        - label: { id: lbl_pack4, text: "P4 --%", text_font: font_sm, x: 360, y: 320 }
        - bar:
            id: bar_pack4
            x: 360
            y: 350
            width: 90
            height: 16
            min_value: 0
            max_value: 100
            value: 0
            indicator: { bg_color: 0x43A047 }
        - label: { id: lbl_pwr4, text: "", text_font: font_xs, text_color: 0x6E7B82, x: 360, y: 370 }
        - label:
            id: lbl_statusbar
            text: "Banco *.."
            text_font: font_sm
            text_color: 0x6E7B82
            align: BOTTOM_MID
            y: -10

    # === Vista 2 — Packs (grid 2x2) ===
    - id: packs_page
      bg_color: 0x000000
      on_swipe_left:
        - lvgl.page.show: cells_page
      on_swipe_right:
        - lvgl.page.show: home_page
      widgets:
        - label:
            text: "PACKS"
            text_font: font_md
            text_color: 0xB0BEC5
            align: TOP_MID
            y: 10
        - obj:
            id: card_pack1
            x: 20
            y: 55
            width: 215
            height: 200
            bg_color: 0x1E1E1E
            border_color: 0x2E3338
            border_width: 1
            radius: 8
            on_short_click:
              - lambda: 'id(selected_pack) = 1;'
              - lvgl.label.update: { id: lbl_cells_title, text: "CELDAS - Pack 1" }
              - lvgl.page.show: cells_page
            widgets:
              - label: { text: "Pack 1", text_font: font_sm, text_color: 0xB0BEC5, x: 10, y: 5 }
              - label: { id: lbl_p1_soc, text: "--%", text_font: font_lg, x: 10, y: 35 }
              - label: { id: lbl_p1_v,   text: "-- V",  text_font: font_sm, x: 10,  y: 100 }
              - label: { id: lbl_p1_i,   text: "-- A",  text_font: font_sm, x: 10,  y: 125 }
              - label: { id: lbl_p1_t,   text: "T -- C",  text_font: font_sm, x: 110, y: 100 }
              - label: { id: lbl_p1_d,   text: "d -- mV", text_font: font_sm, x: 110, y: 125 }
              - label: { id: lbl_p1_w,   text: "-- W",    text_font: font_sm, x: 10,  y: 150 }
              - label: { id: lbl_p1_soh, text: "SoH --%", text_font: font_sm, x: 110, y: 150 }
        - obj:
            id: card_pack2
            x: 245
            y: 55
            width: 215
            height: 200
            bg_color: 0x1E1E1E
            border_color: 0x2E3338
            border_width: 1
            radius: 8
            on_short_click:
              - lambda: 'id(selected_pack) = 2;'
              - lvgl.label.update: { id: lbl_cells_title, text: "CELDAS - Pack 2" }
              - lvgl.page.show: cells_page
            widgets:
              - label: { text: "Pack 2", text_font: font_sm, text_color: 0xB0BEC5, x: 10, y: 5 }
              - label: { id: lbl_p2_soc, text: "--%", text_font: font_lg, x: 10, y: 35 }
              - label: { id: lbl_p2_v,   text: "-- V",  text_font: font_sm, x: 10,  y: 100 }
              - label: { id: lbl_p2_i,   text: "-- A",  text_font: font_sm, x: 10,  y: 125 }
              - label: { id: lbl_p2_t,   text: "T -- C",  text_font: font_sm, x: 110, y: 100 }
              - label: { id: lbl_p2_d,   text: "d -- mV", text_font: font_sm, x: 110, y: 125 }
              - label: { id: lbl_p2_w,   text: "-- W",    text_font: font_sm, x: 10,  y: 150 }
              - label: { id: lbl_p2_soh, text: "SoH --%", text_font: font_sm, x: 110, y: 150 }
        - obj:
            id: card_pack3
            x: 20
            y: 265
            width: 215
            height: 200
            bg_color: 0x1E1E1E
            border_color: 0xFFA726
            border_width: 2
            radius: 8
            on_short_click:
              - lambda: 'id(selected_pack) = 3;'
              - lvgl.label.update: { id: lbl_cells_title, text: "CELDAS - Pack 3 (deg)" }
              - lvgl.page.show: cells_page
            widgets:
              - label: { text: "Pack 3 (deg)", text_font: font_sm, text_color: 0xFFA726, x: 10, y: 5 }
              - label: { id: lbl_p3_soc, text: "--%", text_font: font_lg, text_color: 0xFFA726, x: 10, y: 35 }
              - label: { id: lbl_p3_v,   text: "-- V",  text_font: font_sm, x: 10,  y: 100 }
              - label: { id: lbl_p3_i,   text: "-- A",  text_font: font_sm, x: 10,  y: 125 }
              - label: { id: lbl_p3_t,   text: "T -- C",  text_font: font_sm, x: 110, y: 100 }
              - label: { id: lbl_p3_d,   text: "d -- mV", text_font: font_sm, text_color: 0xFFA726, x: 110, y: 125 }
              - label: { id: lbl_p3_w,   text: "-- W",    text_font: font_sm, x: 10,  y: 150 }
              - label: { id: lbl_p3_soh, text: "SoH --%", text_font: font_sm, x: 110, y: 150 }
        - obj:
            id: card_pack4
            x: 245
            y: 265
            width: 215
            height: 200
            bg_color: 0x1E1E1E
            border_color: 0x2E3338
            border_width: 1
            radius: 8
            on_short_click:
              - lambda: 'id(selected_pack) = 4;'
              - lvgl.label.update: { id: lbl_cells_title, text: "CELDAS - Pack 4" }
              - lvgl.page.show: cells_page
            widgets:
              - label: { text: "Pack 4", text_font: font_sm, text_color: 0xB0BEC5, x: 10, y: 5 }
              - label: { id: lbl_p4_soc, text: "--%", text_font: font_lg, x: 10, y: 35 }
              - label: { id: lbl_p4_v,   text: "-- V",  text_font: font_sm, x: 10,  y: 100 }
              - label: { id: lbl_p4_i,   text: "-- A",  text_font: font_sm, x: 10,  y: 125 }
              - label: { id: lbl_p4_t,   text: "T -- C",  text_font: font_sm, x: 110, y: 100 }
              - label: { id: lbl_p4_d,   text: "d -- mV", text_font: font_sm, x: 110, y: 125 }
              - label: { id: lbl_p4_w,   text: "-- W",    text_font: font_sm, x: 10,  y: 150 }
              - label: { id: lbl_p4_soh, text: "SoH --%", text_font: font_sm, x: 110, y: 150 }
        - label:
            text: "Banco .*."
            text_font: font_sm
            text_color: 0x6E7B82
            align: BOTTOM_MID
            y: -10

    # === Vista 3 — Celdas (drill-down) ===
    - id: cells_page
      bg_color: 0x000000
      on_swipe_right:
        - lvgl.page.show: packs_page
      widgets:
        - label:
            id: lbl_cells_title
            text: "CELDAS - Pack X"
            text_font: font_md
            text_color: 0xB0BEC5
            align: TOP_MID
            y: 10
        - label:
            id: lbl_cells_v
            text: "Vmin --  Vmax --  Vavg --  d -- mV"
            text_font: font_sm
            text_color: 0xFFFFFF
            x: 20
            y: 90
        - label:
            id: lbl_cells_t
            text: "T1 --  T2 --  T3 --  T4 --"
            text_font: font_sm
            text_color: 0xFFFFFF
            x: 20
            y: 150
        - label:
            id: lbl_cells_env
            text: "PCB --   ENV --"
            text_font: font_sm
            text_color: 0xFFFFFF
            x: 20
            y: 210
        - label:
            id: lbl_cells_hint
            text: "(swipe -> volver a Packs)"
            text_font: font_sm
            text_color: 0x666666
            align: BOTTOM_MID
            y: -40
        - label:
            text: "Banco ..*"
            text_font: font_sm
            text_color: 0x6E7B82
            align: BOTTOM_MID
            y: -10

# ============================================================================
# === BMS protocolo Octopus (Octopus BMS protocol decode) ====
# ============================================================================

# === Globals: scheduler state ===
globals:
  - id: mock_soc
    type: float
    initial_value: '78.0'
  - id: selected_pack
    type: int
    initial_value: '1'
  # BMS scheduler state (replicado del C3 cuartoel)
  - { id: current_pack,       type: uint8_t,  restore_value: no, initial_value: '0' }
  - { id: current_cmd_idx,    type: uint8_t,  restore_value: no, initial_value: '0' }
  - { id: should_send_now,    type: bool,     restore_value: no, initial_value: 'false' }
  - { id: last_fast_ms,       type: uint32_t, restore_value: no, initial_value: '0' }
  - { id: last_slow_ms,       type: uint32_t, restore_value: no, initial_value: '0' }
  - { id: next_fast_pack,     type: uint8_t,  restore_value: no, initial_value: '1' }
  - { id: next_slow_pack,     type: uint8_t,  restore_value: no, initial_value: '1' }
  - { id: successful_parses,  type: uint32_t, restore_value: no, initial_value: '0' }

# === BMS BLE: poll intervals ajustables desde HA ===
number:
  - platform: template
    name: "BlueSun Poll Fast (cmd 0x10)"
    id: poll_fast_s
    min_value: 2.0
    max_value: 60.0
    step: 0.5
    initial_value: 5.0
    restore_value: true
    optimistic: true
    mode: slider
    unit_of_measurement: "s"
    icon: "mdi:speedometer"
  - platform: template
    name: "BlueSun Poll Slow (cmd 0x11)"
    id: poll_slow_s
    min_value: 30.0
    max_value: 3600.0
    step: 10.0
    initial_value: 300.0
    restore_value: true
    optimistic: true
    mode: box
    unit_of_measurement: "s"
    icon: "mdi:turtle"

# Sin script: la escritura va via ble_client.ble_write action en el interval scheduler.
# Razon: ESPHome libera el cache de services tras all_nodes_established_, asi que
# id(master).get_characteristic() desde un script falla. ble_client.ble_write se
# registra como node y guarda el char_handle uint16_t que sobrevive al release.

# === Sensores: mocks (LVGL bridge) + parser octopus + 86 sensores BMS ===
sensor:
  # === Mock sensors: leen BMS real si has_state, fallback a constantes ===
  # Su unico proposito util es disparar on_value -> lvgl.label.update.
  - platform: template
    name: "Mock Bank SoC"
    id: mock_bank_soc
    update_interval: 3s
    accuracy_decimals: 1
    lambda: |-
      if (id(bank_soc_avg).has_state() && !isnan(id(bank_soc_avg).state))
        return id(bank_soc_avg).state;
      return id(mock_soc);
    on_value:
      - lvgl.label.update:
          id: lbl_soc_big
          text: !lambda 'return str_sprintf("%.0f%%", x);'
          text_color: !lambda |-
            if (x > 50.0)      return lv_color_hex(0x43A047);
            else if (x > 25.0) return lv_color_hex(0xFFA726);
            else               return lv_color_hex(0xEF5350);
      - lvgl.bar.update:
          id: bar_soc
          value: !lambda 'return (int)x;'
          indicator:
            bg_color: !lambda |-
              if (x > 50.0)      return lv_color_hex(0x43A047);
              else if (x > 25.0) return lv_color_hex(0xFFA726);
              else               return lv_color_hex(0xEF5350);

  - platform: template
    name: "Mock Bank V"
    id: mock_bank_v
    update_interval: 5s
    lambda: |-
      if (id(bank_voltage_avg).has_state() && !isnan(id(bank_voltage_avg).state))
        return id(bank_voltage_avg).state;
      return 0.0f;
  - platform: template
    name: "Mock Bank I"
    id: mock_bank_i
    update_interval: 5s
    lambda: |-
      if (id(bank_current_total).has_state() && !isnan(id(bank_current_total).state))
        return id(bank_current_total).state;
      return 0.0f;
  - platform: template
    name: "Mock Bank P"
    id: mock_bank_p
    update_interval: 5s
    lambda: |-
      if (id(bank_power).has_state() && !isnan(id(bank_power).state))
        return id(bank_power).state;
      return 0.0f;
    on_value:
      - lvgl.label.update:
          id: lbl_vip
          text: !lambda |-
            return str_sprintf("%.1f V    %.1f A    %.0f W",
                               id(mock_bank_v).state,
                               id(mock_bank_i).state,
                               id(mock_bank_p).state);
      # Badge de estado del banco (arriba-izq). signo: + = carga
      - lvgl.label.update:
          id: lbl_mode_badge
          text: !lambda |-
            float i = id(bank_current_total).has_state() ? id(bank_current_total).state : NAN;
            if (isnan(i))        return std::string("");
            if (i >= 0.5f)       return std::string("CARGANDO");
            if (i <= -0.5f)      return std::string("DESCARGANDO");
            return std::string("REPOSO");
          text_color: !lambda |-
            float i = id(bank_current_total).has_state() ? id(bank_current_total).state : NAN;
            if (i >= 0.5f)       return lv_color_hex(0x43A047);   // carga
            else if (i <= -0.5f) return lv_color_hex(0xFF7043);   // descarga
            else                 return lv_color_hex(0x6E7B82);   // reposo
      # Linea derivada: kW | tiempo a lleno/vacio | kWh disponibles
      - lvgl.label.update:
          id: lbl_bank_info
          text: !lambda |-
            float i   = id(bank_current_total).has_state() ? id(bank_current_total).state : NAN;
            float p   = id(bank_power).has_state()          ? id(bank_power).state          : NAN;
            float v   = id(bank_voltage_avg).has_state()    ? id(bank_voltage_avg).state    : NAN;
            float rem = id(bank_remaining_ah).has_state()   ? id(bank_remaining_ah).state   : NAN;
            float nom = id(bank_nominal_ah).has_state()     ? id(bank_nominal_ah).state     : NAN;
            std::string s = isnan(p) ? std::string("-- kW") : str_sprintf("%.1f kW", fabsf(p) / 1000.0f);
            // Autonomia: solo si hay corriente significativa y el calculo es razonable (0..100 h)
            if (!isnan(i) && i >= 0.5f && !isnan(nom) && !isnan(rem)) {
              float h = (nom - rem) / i;
              if (h > 0.0f && h < 100.0f) s += str_sprintf("   %.1f h a lleno", h);
            } else if (!isnan(i) && i <= -0.5f && !isnan(rem)) {
              float h = rem / (-i);
              if (h > 0.0f && h < 100.0f) s += str_sprintf("   %.1f h a vacio", h);
            }
            // Energia disponible (Ah * V)
            if (!isnan(rem) && !isnan(v)) s += str_sprintf("   %.0f kWh", rem * v / 1000.0f);
            return s;

  # Pack SoC mocks: actualizan home_page mini-bars + packs_page cards
  - platform: template
    name: "Mock Pack 1 SoC"
