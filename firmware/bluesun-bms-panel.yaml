# === Scheduler BLE polling ===
# === Scheduler BLE polling (cmd 0x10 fast + cmd 0x11 slow, alterna 4 packs) ===
interval:
  - interval: 500ms
    then:
      - lambda: |-
          id(should_send_now) = false;
          if (!id(master).connected()) return;
          uint32_t now = millis();
          float fast_s = id(poll_fast_s).state;
          if (isnan(fast_s) || fast_s < 2.0f) fast_s = 5.0f;
          uint32_t fast_step_ms = (uint32_t)(fast_s * 1000.0f / 4.0f);
          if (fast_step_ms < 300) fast_step_ms = 300;
          if (now - id(last_fast_ms) >= fast_step_ms) {
            id(last_fast_ms) = now;
            id(current_pack) = id(next_fast_pack);
            id(current_cmd_idx) = 0;
            id(should_send_now) = true;
            id(next_fast_pack) = (id(next_fast_pack) % 4) + 1;
            return;
          }
          float slow_s = id(poll_slow_s).state;
          if (isnan(slow_s) || slow_s < 30.0f) slow_s = 300.0f;
          uint32_t slow_step_ms = (uint32_t)(slow_s * 1000.0f / 4.0f);
          if (slow_step_ms < 5000) slow_step_ms = 5000;
          if (now - id(last_slow_ms) >= slow_step_ms) {
            id(last_slow_ms) = now;
            id(current_pack) = id(next_slow_pack);
            id(current_cmd_idx) = 1;
            id(should_send_now) = true;
            id(next_slow_pack) = (id(next_slow_pack) % 4) + 1;
          }
      - if:
          condition:
            lambda: 'return id(should_send_now);'
          then:
            - ble_client.ble_write:
                id: master
                service_uuid: FFF0
                characteristic_uuid: FFF2
                value: !lambda |-
                  static const uint8_t QUERIES[2][4][8] = {
                    {
                      {0x01, 0x04, 0x10, 0x00, 0x00, 0x12, 0x74, 0xc7},
                      {0x02, 0x04, 0x10, 0x00, 0x00, 0x12, 0x74, 0xf4},
                      {0x03, 0x04, 0x10, 0x00, 0x00, 0x12, 0x75, 0x25},
                      {0x04, 0x04, 0x10, 0x00, 0x00, 0x12, 0x74, 0x92}
                    },
                    {
                      {0x01, 0x04, 0x11, 0x00, 0x00, 0x1a, 0x74, 0xfd},
                      {0x02, 0x04, 0x11, 0x00, 0x00, 0x1a, 0x74, 0xce},
                      {0x03, 0x04, 0x11, 0x00, 0x00, 0x1a, 0x75, 0x1f},
                      {0x04, 0x04, 0x11, 0x00, 0x00, 0x1a, 0x74, 0xa8}
                    }
                  };
                  uint8_t p = id(current_pack);
                  uint8_t c = id(current_cmd_idx);
                  if (p < 1 || p > 4 || c > 1) return std::vector<uint8_t>{};
                  return std::vector<uint8_t>(QUERIES[c][p-1], QUERIES[c][p-1] + 8);

