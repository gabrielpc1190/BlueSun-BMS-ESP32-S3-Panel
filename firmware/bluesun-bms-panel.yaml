  # NOTA: las cards (V/I/T/d/SoH) y la cells_page se actualizan via interval:
  # de abajo, no via on_value de un sensor template (un template que retorna
  # constante solo dispara on_value una vez).

  # === BMS BLE: parser de notificaciones FFF1 (cmd 0x10 + cmd 0x11) ===
  - platform: ble_client
    id: octopus_notify_rx
    internal: true
    ble_client_id: master
    type: characteristic
    service_uuid: "FFF0"
    characteristic_uuid: "FFF1"
    notify: true
    update_interval: never
    name: "Octopus RX (internal)"
    lambda: |-
      if (x.size() < 10) return {};
      auto crc16_modbus = [](const uint8_t *data, size_t len) -> uint16_t {
        uint16_t crc = 0xFFFF;
        for (size_t i = 0; i < len; i++) {
          crc ^= data[i];
          for (int j = 0; j < 8; j++) {
            crc = (crc & 1) ? (crc >> 1) ^ 0xA001 : (crc >> 1);
          }
        }
        return crc;
      };
      uint16_t calc = crc16_modbus(x.data(), x.size() - 2);
      uint16_t recv = x[x.size()-2] | (x[x.size()-1] << 8);
      if (calc != recv) {
        ESP_LOGW("octopus", "CRC mismatch");
        return {};
      }
      uint8_t a1 = x[0];
      uint8_t rsp = x[2];
      auto rd_u16 = [&](int off) -> uint16_t { return (x[3+off] << 8) | x[3+off+1]; };
      auto rd_s16 = [&](int off) -> int16_t { return (int16_t)rd_u16(off); };
      if (rsp == 0x24 && x.size() >= 3 + 36) {
        float voltage = rd_u16(0) / 100.0f;
        float current = rd_s16(2) / 100.0f;
        float rem_ah = rd_u16(4) / 100.0f;
        float nom_ah = rd_u16(6) / 100.0f;
        float soc = rd_u16(10) / 10.0f;
        float soh = rd_u16(12) / 10.0f;
        uint16_t cycles = rd_u16(14);
        ESP_LOGI("octopus", "pack=%d U=%.2fV I=%.2fA SoC=%.1f%%", a1, voltage, current, soc);
        id(successful_parses) += 1;
        switch (a1) {
          case 1:
            id(pack01_voltage).publish_state(voltage); id(pack01_current).publish_state(current);
            id(pack01_soc).publish_state(soc); id(pack01_soh).publish_state(soh);
            id(pack01_cycles).publish_state(cycles);
            id(pack01_remaining_ah).publish_state(rem_ah); id(pack01_nominal_ah).publish_state(nom_ah);
            break;
          case 2:
            id(pack02_voltage).publish_state(voltage); id(pack02_current).publish_state(current);
            id(pack02_soc).publish_state(soc); id(pack02_soh).publish_state(soh);
            id(pack02_cycles).publish_state(cycles);
            id(pack02_remaining_ah).publish_state(rem_ah); id(pack02_nominal_ah).publish_state(nom_ah);
            break;
          case 3:
            id(pack03_voltage).publish_state(voltage); id(pack03_current).publish_state(current);
            id(pack03_soc).publish_state(soc); id(pack03_soh).publish_state(soh);
            id(pack03_cycles).publish_state(cycles);
            id(pack03_remaining_ah).publish_state(rem_ah); id(pack03_nominal_ah).publish_state(nom_ah);
            break;
          case 4:
            id(pack04_voltage).publish_state(voltage); id(pack04_current).publish_state(current);
            id(pack04_soc).publish_state(soc); id(pack04_soh).publish_state(soh);
            id(pack04_cycles).publish_state(cycles);
            id(pack04_remaining_ah).publish_state(rem_ah); id(pack04_nominal_ah).publish_state(nom_ah);
            break;
        }
        return {};
      }
      if (rsp == 0x34 && x.size() >= 3 + 52) {
        uint16_t cmin = 0xFFFF, cmax = 0;
        uint32_t csum = 0;
        for (int i = 0; i < 16; i++) {
          uint16_t v = rd_u16(i * 2);
          if (v < cmin) cmin = v;
          if (v > cmax) cmax = v;
          csum += v;
        }
        uint16_t cavg = csum / 16;
        uint16_t cdelta = cmax - cmin;
        size_t body_len = x.size() - 3 - 2;
        size_t tail_start = (body_len == 54) ? 34 : 32;
        auto k10_to_c = [](uint16_t v) -> float {
          return (v == 0x0AAB) ? NAN : (v / 10.0f - 273.15f);
        };
        float t_cell[4];
        for (int i = 0; i < 4; i++) t_cell[i] = k10_to_c(rd_u16(tail_start + i * 2));
        float t_env = k10_to_c(rd_u16(tail_start + 16));
        float t_pcb = k10_to_c(rd_u16(tail_start + 18));
        ESP_LOGI("octopus", "pack=%d cells[%d/%d/%d d%d] temps[%.1f/%.1f env=%.1f pcb=%.1f]",
                 a1, cmin, cmax, cavg, cdelta, t_cell[0], t_cell[1], t_env, t_pcb);
        id(successful_parses) += 1;
        #define PUBLISH_CT(P) do { \
            id(pack##P##_cell_v_min).publish_state(cmin); id(pack##P##_cell_v_max).publish_state(cmax); \
            id(pack##P##_cell_v_avg).publish_state(cavg); id(pack##P##_cell_v_delta).publish_state(cdelta); \
            if (!isnan(t_cell[0])) id(pack##P##_cell_temp_1).publish_state(t_cell[0]); \
            if (!isnan(t_cell[1])) id(pack##P##_cell_temp_2).publish_state(t_cell[1]); \
            if (!isnan(t_cell[2])) id(pack##P##_cell_temp_3).publish_state(t_cell[2]); \
            if (!isnan(t_cell[3])) id(pack##P##_cell_temp_4).publish_state(t_cell[3]); \
            if (!isnan(t_env))     id(pack##P##_env_temp).publish_state(t_env); \
            if (!isnan(t_pcb))     id(pack##P##_pcb_temp).publish_state(t_pcb); \
          } while (0)
        switch (a1) {
          case 1: PUBLISH_CT(01); break;
          case 2: PUBLISH_CT(02); break;
          case 3: PUBLISH_CT(03); break;
          case 4: PUBLISH_CT(04); break;
        }
        #undef PUBLISH_CT
        return {};
      }
      return {};

  # === BMS sensors per-pack: cmd 0x10 (7 × 4 = 28) ===
  - {platform: template, id: pack01_voltage,      name: "BlueSun Pack01 Voltage",      unit_of_measurement: "V",  accuracy_decimals: 2, device_class: voltage, state_class: measurement}
  # SIGNO CENTRALIZADO (un solo punto facil de invertir, ver lbl_pwrX abajo):
  #   corriente + = CARGA (verde 0x43A047), - = DESCARGA (naranja 0xFF7043), |I|<0.5 = REPOSO (gris 0x6E7B82)
  #   El criterio vive en el on_value de cada pack0X_current. Para invertir el signo del
  #   inversor, basta cambiar la comparacion `i >= DEADBAND` / `i <= -DEADBAND` (mismo patron x4).
  - platform: template
    id: pack01_current
    name: "BlueSun Pack01 Current"
    unit_of_measurement: "A"
    accuracy_decimals: 2
    device_class: current
    state_class: measurement
    on_value:
      - lvgl.label.update:
          id: lbl_pwr1
          # signo: + = carga, - = descarga
          text: !lambda |-
            float i = x;
            std::string cur = str_sprintf("%s%.0fA", (i >= 0 ? "+" : ""), i);
            if (id(pack01_power).has_state() && !isnan(id(pack01_power).state)) {
              float w = id(pack01_power).state;
              return cur + str_sprintf(" %s%.0fW", (w >= 0 ? "+" : ""), w);
            }
            return cur + " --";
          text_color: !lambda |-
            float i = x;            // signo: + = carga
            if (i >= 0.5f)       return lv_color_hex(0x43A047);   // carga
            else if (i <= -0.5f) return lv_color_hex(0xFF7043);   // descarga
            else                 return lv_color_hex(0x6E7B82);   // reposo
